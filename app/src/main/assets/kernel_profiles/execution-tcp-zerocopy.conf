# GhostLock execution tuning for the tcp_zerocopy route (HOCON); include it
# only from profiles whose route (or fallback) is tcp_zerocopy.
execution {
  routes {
    tcp_zerocopy {
      attempts = 2000
      arm_sequence = 16
      post_receive_hold_iterations = 20000
      # zc→stale-waiter overlay word offsets; 0 = baked 6.6 geometry (0x28/0x30).
      # Set per-kernel values when the syscall frame depths differ (e.g. 6.1).
      task_word = 0
      lock_word = 0
    }
  }
}
